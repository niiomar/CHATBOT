name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Lint
        run: uvx ruff check .

      # Deliberately not "--extra ml": that pulls multi-GB CUDA torch wheels and
      # isn't needed to run the test suite (see pyproject.toml).
      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest
