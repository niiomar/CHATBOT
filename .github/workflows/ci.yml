name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Deliberately not "--extra ml": that pulls multi-GB CUDA torch wheels and
      # isn't needed to run the test suite (see pyproject.toml). ruff is pinned via
      # uv.lock (dev dependency) rather than `uvx ruff` so lint results can't drift
      # between an unpinned "latest" and what's actually configured in pyproject.toml.
      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
