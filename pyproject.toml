[project]
name = "rag-system"
version = "0.1.0"
description = "A local RAG chatbot: FastAPI + Streamlit, Ollama LLM, Chroma vector store."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docx2txt>=0.9",
    "fastapi>=0.136.1",
    "langchain-chroma==1.1.0",
    "langchain-classic==1.0.7",
    "langchain-community==0.4.1",
    "langchain-core==1.3.3",
    "langchain-huggingface==1.2.2",
    "langchain-ollama==1.1.0",
    "langchain-protocol==0.0.15",
    "langchain-text-splitters==1.1.2",
    "nltk>=3.9.4",
    "pypdf>=6.10.2",
    "rank-bm25>=0.2.2",
    "requests>=2.33.1",
    "slowapi>=0.1.9",
    "streamlit==1.57.0",
]

[project.optional-dependencies]
# Only needed to actually run ingest.py/api.py (embeddings + reranking).
# Kept separate so CI/tests can install fast without pulling the torch wheel.
# CPU-only build by default (see [tool.uv.sources] below) - it's what nomic-embed-text
# and the cross-encoder reranker actually run on; the LLM itself runs in Ollama, which
# handles its own GPU acceleration independently of this dependency. torchvision/
# torchaudio are dropped: nothing here does vision/audio, so they're dead weight.
# If you have an NVIDIA GPU and want CUDA-accelerated embeddings/reranking, point
# [tool.uv.sources] at https://download.pytorch.org/whl/cuXXX instead.
ml = [
    "einops>=0.8",
    "sentence-transformers>=5.4.1",
    "torch>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.15",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# Explicit rather than relying on ruff's shifting defaults, so local and CI runs
# (and future ruff upgrades) can't silently disagree on what's enabled.
extend-select = ["I", "B", "BLE", "RUF"]
# B008 (function call in a default argument) is a false positive for FastAPI's
# `Depends(...)` dependency-injection idiom - required in the signature, not
# something to move into the function body.
ignore = ["B008"]
